name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release de GitHub para publicar el APK (ej. v1.0.0)'
        required: false
        default: 'v1.0.0'
      upload_to_release:
        description: 'Subir automáticamente a la release en Cuentiva/Cuentiva-platform (true/false)'
        required: false
        default: 'true'
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env asset placeholder
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://cuentiva.onrender.com/api

      - name: Package APK and Calculate SHA-256
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "dev" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi

          APK_NAME="cuentiva-mobile-$TAG.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"

          HASH=$(sha256sum "$APK_NAME" | cut -d ' ' -f 1)
          echo "SHA256: $HASH  $APK_NAME"
          echo "$HASH  $APK_NAME" > SHA256_ANDROID.txt

          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK_PATH=apps/mobile/$APK_NAME" >> $GITHUB_ENV
          echo "HASH_PATH=apps/mobile/SHA256_ANDROID.txt" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: Upload to Cuentiva/Cuentiva-platform Release
        if: ${{ github.event.inputs.upload_to_release != 'false' && env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          echo "Subiendo ${{ env.APK_NAME }} a release ${{ env.RELEASE_TAG }} en Cuentiva/Cuentiva-platform..."
          gh release upload ${{ env.RELEASE_TAG }} --repo Cuentiva/Cuentiva-platform --clobber ${{ env.APK_NAME }} SHA256_ANDROID.txt
          echo "✅ Subida completada exitosamente."
