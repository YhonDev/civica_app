# Configuración de gitleaks para Cívica Pago
# Extiende las reglas por defecto (detección de AWS, GitHub, Supabase,
# connection strings, JWT, claves privadas, etc.).
#
# Comandos útiles:
#   gitleaks detect --source . -c .gitleaks.toml      # escaneo completo (historia)
#   gitleaks protect --staged -c .gitleaks.toml       # lo que usa el pre-commit
#
# Para un hallazgo falso positivo, añade su fingerprint aquí:
#   gitleaks detect --source . --report-path /tmp/gl.json -c .gitleaks.toml
# y copia el campo "Fingerprint" del hallazgo en [[allowlists]].

[extend]
# Usa las reglas por defecto de gitleaks (https://github.com/gitleaks/gitleaks).
useDefault = true

# ─── Falsos positivos verificados (2026-09-08) ────────────────────────────
# Nunca agregar aquí secretos reales. Cada excepción indica por qué es falsa.

# Secreto JWT de la suite e2e: es de desarrollo, necesario para los tests.
[[allowlists]]
description = "Secreto JWT exclusivo de la suite de tests (dev)"
paths = ['''^apps/backend/test/setup-jwt\.ts$''']

# JWT de ejemplo truncado (payload falso) usado para probar el redactado
# de tokens en el cliente HTTP. No es un secreto real.
[[allowlists]]
description = "Tokens falsos en tests unitarios del cliente API"
paths = ['''^apps/mobile/test/unit/network/api_client_test\.dart$''']

# Credenciales demo de la pantalla de login, ya retiradas del código
# (solo aparecen en la historia). El hook no debe re-bloquearlas.
[[allowlists]]
description = "Credenciales demo históricas de login_screen (eliminadas)"
paths = ['''^apps/mobile/lib/screens/auth/login_screen\.dart$''']

# README heredado de la plantilla de NestJS: badge de CircleCI con token
# de ejemplo "abc123def456" del propio template, no un secreto.
[[allowlists]]
description = "Token de ejemplo del badge CircleCI en README de plantilla NestJS"
paths = ['''^apps/backend/README\.md$''']
