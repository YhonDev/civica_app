schema: spec-driven

context: |
  Project: Civica Pago App — mobile payment/civic platform
  Monorepo: apps/backend (NestJS 11, TypeScript 5.7, TypeORM, PostgreSQL/Supabase)
             apps/mobile (Flutter 3.44.6, Dart 3.12.2, drift, flutter_bloc, dio)
             supabase/ (SQL migrations, seed data)
  Architecture: Monorepo with backend API + mobile client + Supabase BaaS
  Testing: Jest 30 (unit + e2e, ts-jest, supertest), flutter_test, flutter_lints
  Tooling: mise (Flutter, cmake, ninja), ESLint 9, Prettier

rules:
  proposal:
    - Include rollback plan for risky changes
    - Consider both backend and mobile impact
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Separate backend and mobile concerns when relevant
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Note Supabase interaction patterns
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - tdd: true
    - test_command_backend: "npm test"
    - test_command_mobile: "flutter test"
  verify:
    test_command_backend: "npm test && npm run test:e2e"
    test_command_mobile: "flutter test"
    build_command_backend: "npm run build"
    build_command_mobile: "flutter build apk --debug"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
